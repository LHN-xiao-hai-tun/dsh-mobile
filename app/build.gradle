plugins {
    id 'com.android.application'
}

// 正式签名配置：从仓库根的 keystore.properties 读取（该文件已被 .gitignore 忽略，绝不入库）
// 若文件不存在（例如他人 clone 本仓库）→ 自动回退为「release 不签名」，assembleDebug 仍可正常构建
def keystorePropsFile = rootProject.file('keystore.properties')
def keystoreProps = new Properties()
def hasReleaseKeystore = keystorePropsFile.exists()
if (hasReleaseKeystore) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

android {
    namespace 'app.dshmobile'
    compileSdk 34

    defaultConfig {
        applicationId "app.dshmobile"
        minSdk 26
        targetSdk 34
        versionCode 10
        versionName "1.2.6"
    }

    signingConfigs {
        if (hasReleaseKeystore) {
            release {
                storeFile file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// ⚠️ 必须显式指定 UTF-8：Windows 中文环境下 javac 默认用 GBK 读源码，
// 源码里的中文字符串会变成乱码（曾产出过「璁剧疆」这样的用户可见乱码标题）。
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Unify Kotlin stdlib version to avoid transitive conflicts from appcompat
configurations.all {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24'
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    // 官方 SplashScreen API（启动页）—— 体积约几十 KB，不引入额外 SDK
    implementation 'androidx.core:core-splashscreen:1.0.1'
}
