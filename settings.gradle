pluginManagement {
    repositories {
        // 国内镜像优先（阿里云）—— **只在本地生效**。
        // ⚠️ CI 上必须走官方源：实测（批 3-2）GitHub Runner 上镜像缺 POM 父链
        //    （commons-io:2.13.0 → commons-parent:58 → org.apache:apache:29），
        //    lint 的 detachedConfiguration 解析失败 ⇒ lintVitalAnalyzeRelease 直接 FAILED。
        //    本地已有 Gradle 缓存，镜像的这个问题在本地看不出来。
        if (System.getenv('CI') == null) {
            maven { url 'https://maven.aliyun.com/repository/gradle-plugin' }
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        if (System.getenv('CI') == null) {
            maven { url 'https://maven.aliyun.com/repository/google' }
            maven { url 'https://maven.aliyun.com/repository/public' }
        }
        google()
        mavenCentral()
    }
}
rootProject.name = "DSH"
include ':app'
