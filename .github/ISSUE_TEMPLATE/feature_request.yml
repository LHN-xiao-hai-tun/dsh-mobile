name: 💡 功能建议
description: 提出一个新功能或改进想法
title: "[Feature] "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        提之前请先看一眼：本 App 的定位是**极简 WebView 容器**（约 3 MB，不含 DSH 本体、不预置地址、不采集数据）。
        过度膨胀功能或引入第三方 SDK 的建议，通常会因为违背这一定位而被拒绝 —— 但这不意味着不值得提，说清理由即可。
  - type: textarea
    id: problem
    attributes:
      label: 你遇到的问题 / 痛点
      description: 先说场景，再说功能 —— 这样更容易判断该怎么解决
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 你希望的方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 你考虑过的替代方案（可选）
    validations:
      required: false
  - type: dropdown
    id: scope
    attributes:
      label: 这个建议会不会增加体积或引入第三方依赖
      options:
        - 不会（纯本地功能）
        - 会，但很小
        - 不确定
        - 会明显变大
    validations:
      required: true
