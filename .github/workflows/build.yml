name: Build

# ── 版本口径（2026-09-23 升级）────────────────────────────────────
# 起因：runner 报 `Node.js 20 is deprecated. The following actions target Node.js 20 but are
# being forced to run on Node.js 24: actions/checkout@v4, actions/setup-java@v4,
# actions/upload-artifact@v4, android-actions/setup-android@v3, gradle/actions/setup-gradle@v4`，
# 且 setup-java 明确提示 `v4 is deprecated ... migrate to @v5`。
# ⇒ 统一升到**维护中的大版本**（版本号取自各仓库当时的 latest release）：
#      actions/checkout            v4 → v7
#      actions/setup-java          v4 → v6
#      actions/upload-artifact     v4 → v7
#      android-actions/setup-android v3 → v4
#      gradle/actions/setup-gradle v4 → v6
# ⚠️ 本文件的作业**只改版本号**，steps 结构与 inputs 一字未动（见该次提交的 diff）。
#
# ── 两个与本仓库环境有关的提醒 ───────────────────────────────────
# ① **本机（中文路径）跑不了单测**：项目真身在 `D:\RJ\ai\造物工坊\dsh-app`（非 ASCII），
#    实测 Gradle 的 test worker 会 `ClassNotFoundException`（compiled 类就在 classpath 上却加载不到）；
#    复制到纯 ASCII 路径下同一份源码 21 个测试全过 ⇒ 是**路径**问题，不是代码问题。
#    ⇒ 本机跑测试请走 ASCII junction：`pwsh -File scripts\unit-test.ps1`（工作区 scripts\ 里有）。
#    CI 的路径是 ASCII，**不受影响**。
# ② **lint 闸在本地出包那一步**：`app/build.gradle` 里已把 `NewApi` 提为 fatal
#    （lintVital 默认只拦 Fatal，而 NewApi 是 Error ⇒ v1.3.4/v1.3.5 曾把
#    「Android 8~13 上一跑就崩」的调用发出去）。本作业的完整 `lintRelease` 是第二道。

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── ① 冒烟：debug 包能构建 ────────────────────────────────
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # 用 setup-gradle 提供 Gradle，避免依赖 gradle-wrapper.properties 里的国内镜像
      # （本地开发者仍可用 ./gradlew，走镜像更快）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dsh-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # ── ② Lint（批 3-2 新增）──────────────────────────────────
  lint:
    name: lintRelease
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.9'

      # lintVital（阻塞级）已随 assembleRelease 跑；这里跑完整 lintRelease。
      # 报告 always 上传（失败也看得到）；**不因存量 warning 阻断**——先"看得见"再谈"过不去"。
      - name: Run lint
        run: gradle lintRelease --no-daemon --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: warn
          retention-days: 14

  # ── ③ 单元测试（批 3-2 新增 · 当前尚无测试源）─────────────
  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.9'

      # ⚠️ 仓库目前**没有 app/src/test**（0 个测试源）⇒ 这一步会以 NO-SOURCE 通过。
      #    意义是「先把闸门装好」：一旦补上测试（批 3-4 测试矩阵），CI 不用改。
      - name: Run unit tests
        run: gradle testReleaseUnitTest --no-daemon --stacktrace

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: unit-test-report
          path: app/build/reports/tests/**
          if-no-files-found: warn
          retention-days: 14

  # ── ④ 可复现闸 + 校验和（批 3-2 新增 · 把批 3-1 的成果交给 CI 把守）──────
  #
  # ⚠️ 签名口径（**必读：别把 CI 的哈希当发布哈希**）
  #   CI 里没有 keystore（密钥不进仓库）⇒ 这里构建的是**未签名的 release APK**，
  #   它的 SHA-256 与「本地签名后发布的那一份」**必然不同**。
  #   所以本作业干两件事：① 当「构建可复现」的守门员（自己跟自己比）；
  #   ② 产出未签名工件的校验和供下载核对。
  #   正式发布的哈希仍由本地 `scripts\release.ps1` 计算并写进 Release Notes。
  determinism:
    name: 可复现闸（连续两次 clean 构建比哈希）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.9'

      - name: 第 1 次 clean assembleRelease
        run: gradle clean assembleRelease --no-daemon

      - name: 记下第 1 次哈希
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          echo "本次产物: $APK"
          cp "$APK" /tmp/build1.apk
          sha256sum /tmp/build1.apk | tee /tmp/hash1.txt

      - name: 第 2 次 clean assembleRelease
        run: gradle clean assembleRelease --no-daemon

      - name: 比对哈希（不一致即失败）
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          cp "$APK" /tmp/build2.apk
          sha256sum /tmp/build2.apk | tee /tmp/hash2.txt
          h1=$(cut -d' ' -f1 /tmp/hash1.txt)
          h2=$(cut -d' ' -f1 /tmp/hash2.txt)
          echo "构建1 = $h1"
          echo "构建2 = $h2"
          if [ "$h1" != "$h2" ]; then
            echo "::error::构建不可复现！两次 clean 构建哈希不同 ⇒ 先查 app/build.gradle 的 dependenciesInfo.includeInApk 是否被打开"
            exit 1
          fi
          echo "::notice::可复现闸通过：两次 clean 构建哈希一致（$h1）"

      - name: 产出校验和
        run: |
          cd /tmp
          sha256sum build2.apk > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload 校验和 + 未签名 release APK
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-unsigned-apk-sha256
          path: |
            /tmp/SHA256SUMS.txt
            /tmp/build2.apk
          if-no-files-found: error
          retention-days: 14

  # ── ⑥ 发布（tag `v*` 触发）──────────────────────────────────────────
  #
  # 🔑 签名口径（**A 路 · 2026-09-23 用户拍板启用；B 路仍在**）：
  #   密钥在 **Environment `release` 的环境级 Secrets** 里（`KEYSTORE_B64` / `KEYSTORE_PASSWORD` /
  #   `KEY_ALIAS` / `KEY_PASSWORD`）⇒ 本作业**云端签名**，产出**规范名**资产：
  #     `dsh-mobile-vX.Y.Z.apk` + `.apk.sha256`
  #   ⚠️ **三条加固**（缺一不可，都是这次一起上的）：
  #     ① `environment: release` ⇒ 该环境配了 **Required reviewers（= 仓库 owner）且 can_admins_bypass=false**
  #        ⇒ **没人工点批准，本作业不会执行**（密钥也读不到）。这是"workflow/tag 被改也签不出来"的那道闸。
  #     ② 本文件所有 `uses:` 都**钉到 commit SHA**（仓库设置 `sha_pinning_required=true` 强制）⇒ 防"移动的 tag"。
  #     ③ tag/分支保护规则见仓库 Rulesets（只允许 owner 动 `v*`）。
  #   🔻 **降级路径（B 路）**：若 Secrets 不存在（例如回滚时删掉），本作业自动回到旧行为 ——
  #      出**未签名** `-unsigned` 占位，由本地 `scripts\release.ps1` 签名后替换并删占位。
  #
  # ⚠️ 两条硬约束：
  #   ① `permissions` 全局是 `contents: read` ⇒ **只在本作业**提到 `contents: write`（建 Release 要），别全局提权；
  #   ② 必须 `needs: [lint, test]` ⇒ **红灯不发版**（在红的基础上自动化 = 自动发坏包）。
  release:
    name: release（tag 触发 · 有密钥则云端签名）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    environment: release            # 🔴 加固①：签名密钥挂在本环境 ⇒ 未批准不执行
    permissions:
      contents: write               # ⚠️ 仅本作业；建 Release / 上传资产需要
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6
        with:
          gradle-version: '8.9'

      # ── A 路：从 Secrets 还原密钥；没有就标记走 B 路 ──
      - name: 还原签名密钥（有 Secrets ⇒ A 路）
        id: ks
        env:
          KS_B64: ${{ secrets.KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KS_B64:-}" ]; then
            echo "signed=no" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置签名密钥 ⇒ 本次走 B 路（未签名占位 + 本地签名替换）"
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/ks"
          printf '%s' "$KS_B64" | base64 -d > "$RUNNER_TEMP/ks/release.jks"
          # build.gradle 是"有 keystore.properties 就签名"⇒ 一行构建脚本都不用改
          {
            echo "storeFile=$RUNNER_TEMP/ks/release.jks"
            echo "storePassword=$KS_PASS"
            echo "keyAlias=$KS_ALIAS"
            echo "keyPassword=$KEY_PASS"
          } > keystore.properties
          echo "signed=yes" >> "$GITHUB_OUTPUT"
          echo "::notice::已还原签名密钥（内容不打印）"

      - name: 构建 release APK
        run: gradle assembleRelease --no-daemon --stacktrace

      # ── 🔴 签名指纹自检：不匹配宁可不发（换钥匙 = 老用户无法覆盖安装）──
      - name: 🔴 签名指纹自检（A 路）
        if: steps.ks.outputs.signed == 'yes'
        env:
          EXPECTED: ${{ vars.EXPECTED_CERT_SHA256 }}
        run: |
          set -euo pipefail
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -n 1)
          APK=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          FP=$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*SHA-256 digest: //p' | tr 'A-Z' 'a-z' | tr -d ':')
          echo "签名指纹 = $FP"
          echo "期望指纹 = $EXPECTED"
          if [ -z "$FP" ]; then echo "::error::APK 没有签名！"; exit 1; fi
          if [ "$FP" != "$EXPECTED" ]; then
            echo "::error::签名指纹与 EXPECTED_CERT_SHA256 不符 —— 拒绝发布（换钥匙会让老用户无法覆盖安装）"
            exit 1
          fi
          echo "::notice::签名指纹 == 期望 ✅"

      - name: 产物命名 + 生成 .sha256
        id: pack
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"                        # 例如 v1.3.11
          APK_SRC=$(ls app/build/outputs/apk/release/*.apk | head -n 1)
          if [ "${{ steps.ks.outputs.signed }}" = "yes" ]; then
            OUT="dsh-mobile-${TAG}.apk"                   # ✅ 规范名（Obtainium 认它）
          else
            OUT="dsh-mobile-${TAG}-unsigned.apk"          # ⚠️ 占位：带 -unsigned，Obtainium 不误抓
          fi
          cp "$APK_SRC" "$OUT"
          sha256sum "$OUT" | awk '{print $1}' > "${OUT}.sha256"
          echo "== 产物 =="; ls -l "$OUT" "${OUT}.sha256"; cat "${OUT}.sha256"
          echo "out=$OUT" >> "$GITHUB_OUTPUT"

      - name: 生成 Release Notes（A 路：CHANGELOG 本节 + 校验表）
        id: notes
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"; VER="${TAG#v}"
          APK="${{ steps.pack.outputs.out }}"
          HASH=$(cat "${APK}.sha256"); SIZE=$(stat -c%s "$APK")
          {
            if [ "${{ steps.ks.outputs.signed }}" = "yes" ]; then
              # 从 CHANGELOG.md 抽 `## [VER]` 到下一个 `## [` 之间（抽不到就失败，绝不发空 notes）
              awk -v ver="$VER" '
                $0 ~ "^## \\[" ver "\\]" {f=1; print; next}
                f && /^## \[/ {exit}
                f {print}
              ' CHANGELOG.md
              if ! awk -v ver="$VER" '$0 ~ "^## \\[" ver "\\]" {f=1} END{exit !f}' CHANGELOG.md; then
                echo "::error::CHANGELOG.md 里找不到 [${VER}] 段 —— 拒绝发布"
                exit 1
              fi
              echo
            else
              echo "## DSH Mobile ${TAG}（CI 占位 · 未签名）"
              echo
              echo "> 本资产是**未签名**占位（CI 无密钥时走 B 路）。正式签名包由本地 \`release.ps1\` 上传并删除本占位。"
              echo
            fi
            echo '---'
            echo
            echo '## 校验（发布件可对应 tag）'
            echo
            echo '| 项 | 值 |'
            echo '|---|---|'
            echo "| 版本 | \`${VER}\` |"
            echo '| 最低 Android | **8.0（API 26）** |'
            echo "| tag | \`${TAG}\` → \`${GITHUB_SHA}\` |"
            echo "| 资产 | \`${APK}\` |"
            echo "| 体积 | ${SIZE} B |"
            echo "| SHA-256 | \`${HASH}\` |"
            echo "| 签名 | $([ "${{ steps.ks.outputs.signed }}" = "yes" ] && echo "✅ 已签名（CI 云端签名）" || echo "⚠️ 未签名（占位）") |"
          } > /tmp/notes.md
          echo "== notes 预览（前 20 行）=="; head -n 20 /tmp/notes.md

      - name: 建 Release 并上传资产
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          APK="${{ steps.pack.outputs.out }}"
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --notes-file /tmp/notes.md \
            --target "$GITHUB_SHA" \
            "${APK}#${APK}" "${APK}.sha256#${APK}.sha256"

      - name: 回查 Release 资产（自检）
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[] | "\(.name)  \(.size) B"'

      - name: 清掉临时密钥（卫生 · 无论成败都跑）
        if: always()
        run: |
          rm -f keystore.properties "$RUNNER_TEMP/ks/release.jks" || true
          echo "临时密钥已清除"

  # 独立作业：确认 gradlew 本身可用（shebang 为 LF、jar 在库）
  # —— 曾经的缺陷：仓库只有 gradlew.bat，README 里的 ./gradlew 与 CI 都跑不起来。
  wrapper:
    name: gradle wrapper 可用性
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6
        with:
          distribution: temurin
          java-version: '17'

      # ① 权限位与 jar （真实缺陷：gradlew 曾以 100644 入库 → Linux/macOS 上
      #    ./gradlew 直接 Permission denied，README 与 CI 都跑不起来）
      - name: gradlew 可执行位 + wrapper jar 完整性
        run: |
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          unzip -l gradle/wrapper/gradle-wrapper.jar > /dev/null

      # ② 端到端：真跑一次 wrapper。⚠️ 依赖 gradle-wrapper.properties 里
      #    的 distributionUrl（当前为腾讯镜像）在 runner 上可达，故不阻断构建。
      - name: Run ./gradlew --version (non-blocking)
        run: ./gradlew --version || echo "::warning::wrapper 下载失败 —— distributionUrl 镜像在 runner 上可能不可达"
