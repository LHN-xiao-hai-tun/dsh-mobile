name: Build

on:
  push:
    branches: [ master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-34 build-tools;34.0.0'

      # 用 setup-gradle 提供 Gradle，避免依赖 gradle-wrapper.properties 里的国内镜像
      # （本地开发者仍可用 ./gradlew，走镜像更快）
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

  # 独立作业：确认 gradlew 本身可用（shebang 为 LF、jar 在库）
  # —— 曾经的缺陷：仓库只有 gradlew.bat，README 里的 ./gradlew 与 CI 都跑不起来。
  wrapper:
    name: gradle wrapper 可用性
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ① 权限位与 jar （真实缺陷：gradlew 曾以 100644 入库 → Linux/macOS 上
      #    ./gradlew 直接 Permission denied，README 与 CI 都跑不起来）
      - name: gradlew 可执行位 + wrapper jar 完整性
        run: |
          test -x ./gradlew
          test -f gradle/wrapper/gradle-wrapper.jar
          unzip -l gradle/wrapper/gradle-wrapper.jar > /dev/null

      # ② 端到端：真跑一次 wrapper。⚠️ 依赖 gradle-wrapper.properties 里
      #    的 distributionUrl（当前为腾讯镜像）在 runner 上可达，故不阻断构建。
      - name: Run ./gradlew --version (non-blocking)
        run: ./gradlew --version || echo "::warning::wrapper 下载失败 —— distributionUrl 镜像在 runner 上可能不可达"
